name: Release

# Auto-bump the version on every merge to main, driven by Conventional Commits.
#
# scripts/release.mjs inspects the commits that just landed and picks the bump
# (a breaking change or a feat is a minor bump while the version is 0.x; any
# other commit is a patch), writes the one version to package.json,
# .omp-plugin/marketplace.json and the three .asd files, and stamps a dated
# section in CHANGELOG.md. This job then commits that as
# `chore(release): vX.Y.Z`, tags it, and pushes both back to main. See
# CONTRIBUTING.md -> Versioning.
#
# A release then gets its engine images. The `bump` job makes a GitHub release
# for the tag, and the `image` job builds the engine's image at that tag on a
# Linux, a macOS and a Windows runner (`bun scripts/build-image.ts --dist`, the
# one way an image is built) and attaches each to the release under the name
# the plugin looks for in its `dist/` folder: omp-re-engine-<platform>-<arch>,
# with .exe on Windows. docs/install.md says what a user does with one. The
# `image` job had not been run when it was written: a red leg is information
# about that runner's SBCL, and a release without an image is still a release
# — omp-re builds its own image on the user's machine.
#
# No recursion: a push authenticated with the default GITHUB_TOKEN does not
# trigger further workflow runs, so the release commit/tag this job pushes does
# NOT re-run CI or this workflow.
#
# Assumes main accepts a direct push from Actions. If you protect main against
# that, this job's push will fail — grant it bypass, or move to a release-PR
# flow (and swap the GITHUB_TOKEN loop-guard for a `[skip ci]`-style one).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
    # Belt-and-suspenders: never act on our own release commit. (Only reachable
    # if someone swaps GITHUB_TOKEN for a PAT, which would re-trigger pushes.)
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the commit range and tag lookup
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide and apply the version bump
        id: bump
        run: node scripts/release.mjs "${{ github.event.before }}" "${{ github.sha }}"

      - name: Commit, tag and push the release
        if: ${{ steps.bump.outputs.released == 'true' }}
        env:
          V: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json .omp-plugin/marketplace.json omp-re.asd omp-re-stdio.asd nodecode-re.asd CHANGELOG.md
          git commit -m "chore(release): v${V}"
          git tag -a "v${V}" -m "v${V}"
          git push origin HEAD:main
          git push origin "v${V}"

      - name: Make the GitHub release the images are attached to
        if: ${{ steps.bump.outputs.released == 'true' }}
        env:
          V: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${V}" --verify-tag --title "v${V}" --notes "What changed is in CHANGELOG.md. The omp-re-engine-* files are engine images; docs/install.md says what they are for."

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ "${{ steps.bump.outputs.released }}" = "true" ]; then
            echo "Released **v${{ steps.bump.outputs.version }}** (${{ steps.bump.outputs.level }} bump from ${{ steps.bump.outputs.previous }})." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release-worthy commits in this push; version stays ${{ steps.bump.outputs.previous }}." >> "$GITHUB_STEP_SUMMARY"
          fi

  image:
    needs: bump
    if: ${{ needs.bump.outputs.released == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.bump.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install SBCL and cl-ppcre (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sbcl cl-ppcre
      - name: Install SBCL and cl-ppcre (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          brew install sbcl
          git clone --depth 1 --branch v2.1.1 https://github.com/edicl/cl-ppcre "$HOME/common-lisp/cl-ppcre"
      # As cross-os.yml installs it: a later step does not see what the
      # installer added to the machine's PATH.
      - name: Install SBCL and cl-ppcre (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install sbcl -y --no-progress
          $exe = Get-ChildItem -Path $env:ProgramFiles -Filter sbcl.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "sbcl.exe was not found under $env:ProgramFiles after the install" }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SBCL_HOME=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git clone --depth 1 --branch v2.1.1 https://github.com/edicl/cl-ppcre "$HOME\common-lisp\cl-ppcre"

      - name: Build the engine image for this system
        run: bun scripts/build-image.ts --dist

      - name: Attach it to the release
        shell: bash
        env:
          V: ${{ needs.bump.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${V}" dist/omp-re-engine-* --clobber
