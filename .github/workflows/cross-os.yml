name: Cross-OS

# Runs the FULL test suite with rizin installed on Linux, macOS, and Windows,
# so the OS-specific paths — above all the debugger (debug.test.ts executes the
# fixture under rizin's debugger) and the PE/Mach-O format handling — get real
# coverage on the real OS. The default CI (ci.yml) stays deliberately
# rizin-free and fast; this is the "borrow a Windows/macOS runner per run"
# tier, so it is manual (workflow_dispatch) rather than on every push.
#
# This workflow is authored on a Linux dev box and cannot be run there, so the
# three steps below are the expected first-dispatch tweak points — verify them
# on the first manual run and adjust if the runner images differ:
#   1. the per-OS rizin install (pinned to v0.9.1; no .deb exists, so Linux
#      uses the portable static tarball, macOS uses Homebrew, Windows the
#      release zip);
#   2. clang producing a runnable PE on windows-latest;
#   3. macOS debugging a self-built binary — rizin's debugger may need `sudo`
#      or a codesigned rizin for task_for_pid; if the debug.test.ts launch
#      tests fail only on macOS, that is the cause (see docs/testing.md).
#
# Never add a malware sample here — the fixture is a trivial program built from
# test/fixtures/sample.c on the runner.

on:
  workflow_dispatch:

env:
  RIZIN_VERSION: "0.9.1"

jobs:
  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false # one OS failing must not cancel the others — we want all three results
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # --- install rizin v0.9.1 (there is no .deb in the release) ---
      - name: Install rizin (macOS, Homebrew)
        if: runner.os == 'macOS'
        run: brew install rizin

      - name: Install rizin (Linux, portable static build)
        if: runner.os == 'Linux'
        run: |
          set -eux
          curl -fsSL "https://github.com/rizinorg/rizin/releases/download/v${RIZIN_VERSION}/rizin-v${RIZIN_VERSION}-static-x86_64.tar.xz" -o /tmp/rizin.tar.xz
          mkdir -p "$HOME/rizin" && tar -xJf /tmp/rizin.tar.xz -C "$HOME/rizin"
          # Add whatever directory holds the rizin binary (layout-agnostic).
          dirname "$(find "$HOME/rizin" -type f -name rizin | head -1)" >> "$GITHUB_PATH"

      - name: Install rizin (Windows, release zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/rizinorg/rizin/releases/download/v$env:RIZIN_VERSION/rizin-windows-shared64-v$env:RIZIN_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile rizin.zip
          Expand-Archive rizin.zip -DestinationPath "$HOME\rizin"
          # Add whatever directory holds rizin.exe (the shared build keeps its DLLs beside it).
          $exe = Get-ChildItem -Path "$HOME\rizin" -Filter rizin.exe -Recurse | Select-Object -First 1
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show rizin version
        run: rizin -v

      # --- build the test fixture (a binary with main, locals, calls, a string) ---
      # The default /bin/ls fixture is absent on Windows and SIP-protects the
      # debugger on macOS, so each OS compiles test/fixtures/sample.c and points
      # OMPRE_TEST_BINARY at it. Ground truth is still read from rizin at runtime.
      - name: Build fixture (Unix)
        if: runner.os != 'Windows'
        run: |
          cc -o fixture test/fixtures/sample.c
          echo "OMPRE_TEST_BINARY=$PWD/fixture" >> "$GITHUB_ENV"

      - name: Build fixture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang test/fixtures/sample.c -o fixture.exe
          "OMPRE_TEST_BINARY=$PWD\fixture.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: bun install --ignore-scripts
      - run: bun run check
      # No OMPRE_ENABLE_DEBUGGER here: debug.test.ts sets and restores it itself,
      # and extension-sdk.test.ts asserts the default-off behavior — setting it
      # globally would break that assertion.
      - run: bun test
