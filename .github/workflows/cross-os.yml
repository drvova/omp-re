name: Cross-OS

# Runs the FULL test suite with rizin installed on Linux and Windows, so the
# OS-specific paths — the debugger (debug.test.ts executes the fixture under
# rizin's debugger) and PE format handling — get real coverage on the real OS.
# The default CI (ci.yml) stays deliberately rizin-free and fast; this is the
# "borrow a Windows runner per run" tier.
#
# macOS was dropped from the matrix. Its one unique value — the debugger —
# can't run on a hosted macOS runner (rizin's Darwin backend needs
# task_for_pid, refused to a non-root, un-codesigned rizin), so debug.test.ts
# gates its live-debug blocks off on macOS anyway. With the debugger gated off
# the leg still wedged `bun test` for ~20 min for a reason that could not be
# diagnosed from CI — a timed-out job is *cancelled*, and GitHub archives no
# downloadable log for a cancelled job, so the hang point was never visible.
# The remaining macOS coverage (Mach-O static analysis) overlaps Linux's ELF
# coverage. debug.test.ts keeps its `process.platform === "darwin"` gate so a
# local macOS dev run still skips the debugger cleanly (see docs/testing.md).
#
# Install notes (verified working on the first runs): Linux uses the portable
# static release tarball (no .deb exists); Windows uses the
# rizin-windows-shared64 release zip; both pinned to v0.9.1. clang builds the
# fixture PE on Windows.
#
# Never add a malware sample here — the fixture is a trivial program built from
# test/fixtures/sample.c on the runner.
#
# Runs on every push to main (alongside the fast ci.yml) and on manual dispatch.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  RIZIN_VERSION: "0.9.1"

jobs:
  suite:
    name: suite (${{ matrix.os }})
    strategy:
      fail-fast: false # one OS failing must not cancel the other — we want both results
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A healthy leg finishes in a couple of minutes; cap it so a wedged run
    # fails fast and frees the borrowed runner instead of holding it for the
    # 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # --- install rizin v0.9.1 (there is no .deb in the release) ---
      - name: Install rizin (Linux, portable static build)
        if: runner.os == 'Linux'
        run: |
          set -eux
          curl -fsSL "https://github.com/rizinorg/rizin/releases/download/v${RIZIN_VERSION}/rizin-v${RIZIN_VERSION}-static-x86_64.tar.xz" -o /tmp/rizin.tar.xz
          mkdir -p "$HOME/rizin" && tar -xJf /tmp/rizin.tar.xz -C "$HOME/rizin"
          # Add whatever directory holds the rizin binary (layout-agnostic).
          dirname "$(find "$HOME/rizin" -type f -name rizin | head -1)" >> "$GITHUB_PATH"

      - name: Install rizin (Windows, release zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/rizinorg/rizin/releases/download/v$env:RIZIN_VERSION/rizin-windows-shared64-v$env:RIZIN_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile rizin.zip
          Expand-Archive rizin.zip -DestinationPath "$HOME\rizin"
          # Add whatever directory holds rizin.exe (the shared build keeps its DLLs beside it).
          $exe = Get-ChildItem -Path "$HOME\rizin" -Filter rizin.exe -Recurse | Select-Object -First 1
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show rizin version
        run: rizin -v

      # --- build the test fixture (a binary with main, locals, calls, a string) ---
      # The default /bin/ls fixture is absent on Windows, so each OS compiles
      # test/fixtures/sample.c and points OMPRE_TEST_BINARY at it. Ground truth
      # is still read from rizin at runtime.
      - name: Build fixture (Linux)
        if: runner.os == 'Linux'
        run: |
          cc -o fixture test/fixtures/sample.c
          echo "OMPRE_TEST_BINARY=$PWD/fixture" >> "$GITHUB_ENV"

      - name: Build fixture (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang test/fixtures/sample.c -o fixture.exe
          "OMPRE_TEST_BINARY=$PWD\fixture.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: bun install --ignore-scripts
      - run: bun run check

      # The debugger's attach-by-pid test attaches to a process that is not a
      # child of rizin; hosted Linux runners default to
      # kernel.yama.ptrace_scope=1, which forbids attaching to a non-descendant.
      # Relax it so the debugger integration suite runs for real. (Windows
      # permits the attach as-is.)
      - name: Allow ptrace attach by PID (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      # No OMPRE_ENABLE_DEBUGGER here: debug.test.ts sets and restores it itself,
      # and extension-sdk.test.ts asserts the default-off behavior — setting it
      # globally would break that assertion.
      - run: bun test
