name: Cross-OS

# The Windows leg. ci.yml is the Linux one and runs everything; this runs what
# can run on Windows today, on a hosted Windows runner:
#
#   - the type check;
#   - system omp-re loaded in a plain SBCL;
#   - the bun suites, which load the extension through omp's SDK and so start
#     the engine process, drive rizin over its pipe, and open a PE.
#
# It does not run the Lisp suite (test/nodecode/run.lisp): the suite's harness
# and its stand-in programs are POSIX (sb-posix, /bin/sh scripts). Three tests
# of test/shim.test.ts that use a shell-script stand-in for the engine skip
# themselves on Windows too.
#
# This leg was written with the engine's move to Common Lisp and had not been
# seen to pass when it was written. A red run here is information about
# Windows, not a flake to retry: docs/testing.md lists what is unproven.
#
# There is no macOS leg. An earlier one wedged `bun test` for ~20 minutes for a
# reason that could not be read from CI (a timed-out job is cancelled, and
# GitHub keeps no log for a cancelled job), and rizin's debugger cannot run on
# a hosted macOS runner (its Darwin backend needs task_for_pid, refused to an
# unsigned rizin that is not root). Nothing in CI runs omp-re on macOS.
#
# Install notes: rizin is the rizin-windows-shared64 release zip, pinned.
# SBCL is Chocolatey's package; a later step does not see what an installer
# added to the machine's PATH, so the step that installs it also puts its
# folder on GITHUB_PATH and sets SBCL_HOME. cl-ppcre is cloned to
# ~/common-lisp/cl-ppcre, one of the places ASDF looks by default. clang
# builds the fixture PE.
#
# Never add a malware sample here — the fixture is a trivial program built from
# test/fixtures/sample.c on the runner.
#
# Runs on every push to main (alongside ci.yml) and on manual dispatch.

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  RIZIN_VERSION: "0.9.1"

jobs:
  windows:
    runs-on: windows-latest
    # A healthy run takes a few minutes; cap it so a wedged one fails fast
    # instead of holding the runner for the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install SBCL and cl-ppcre
        shell: pwsh
        run: |
          choco install sbcl -y --no-progress
          $exe = Get-ChildItem -Path $env:ProgramFiles -Filter sbcl.exe -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "sbcl.exe was not found under $env:ProgramFiles after the install" }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SBCL_HOME=$($exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          git clone --depth 1 --branch v2.1.1 https://github.com/edicl/cl-ppcre "$HOME\common-lisp\cl-ppcre"

      - name: Install rizin (release zip)
        shell: pwsh
        run: |
          $url = "https://github.com/rizinorg/rizin/releases/download/v$env:RIZIN_VERSION/rizin-windows-shared64-v$env:RIZIN_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile rizin.zip
          Expand-Archive rizin.zip -DestinationPath "$HOME\rizin"
          # Add whatever directory holds rizin.exe (the shared build keeps its DLLs beside it).
          $exe = Get-ChildItem -Path "$HOME\rizin" -Filter rizin.exe -Recurse | Select-Object -First 1
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Show tool versions
        shell: pwsh
        run: |
          bun --version
          sbcl --version
          rizin -v

      # /bin/ls, the suites' default fixture, does not exist here. Ground truth
      # is still read from rizin at run time.
      - name: Build fixture
        shell: pwsh
        run: |
          clang test/fixtures/sample.c -o fixture.exe
          "OMPRE_TEST_BINARY=$PWD\fixture.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - run: bun install --ignore-scripts

      - name: Type check
        run: bun run check

      - name: The engine loads alone
        shell: pwsh
        # No string in the forms, so no quote has to survive the shell.
        run: sbcl --non-interactive --eval '(require :asdf)' --eval '(asdf:load-asd (merge-pathnames (string-downcase :omp-re.asd) (uiop:getcwd)))' --eval '(asdf:load-system :omp-re)'

      # No OMPRE_ENABLE_DEBUGGER here: extension-sdk.test.ts asserts the
      # default-off behaviour and switches it on itself where it tests the
      # debugger.
      - name: The bun suites
        run: bun test test/
