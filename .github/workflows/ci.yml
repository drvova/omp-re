name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --ignore-scripts
      - run: bun run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --ignore-scripts
      # No rizin install here. The rizin-free suites — including
      # extension-sdk, which loads the extension through omp's real SDK and
      # catches host API drift — run in full; the rizin suites
      # `describe.skipIf(...)` themselves out except for their rizin-free tests
      # — 102 pass, 98 skip, 0 fail, exit code 0. That is the expected shape of
      # this job; run the rizin suites locally (they use /bin/ls). See
      # docs/testing.md. Never fetch a malware sample into CI.
      - run: bun test

  # The nodecode cell's Lisp, loaded for real and driven against the real
  # bridge (test/nodecode/smoke.lisp). It runs over a stand-in for nodecode's
  # kernel, so it proves the cell's own code; see docs/testing.md. No rizin
  # here: the smoke test's rizin half prints SKIPPED.
  nodecode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sbcl
      - run: bun install --ignore-scripts
      - run: bun run test:nodecode
