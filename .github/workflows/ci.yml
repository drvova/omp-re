name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --ignore-scripts
      - run: bun run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --ignore-scripts
      # No rizin install here. 5 suites (rizin-pure, format, evidence, audit,
      # report) run unconditionally and must pass in full; the rizin suites
      # (rizin-integration, tools-registry, tools-mutate-registry) need a real
      # rizin, so they `describe.skipIf(...)` themselves out except for their
      # rizin-free tests — 54 pass, 63 skip, 0 fail, exit code 0. That is the
      # expected shape of this job; run the rizin suites locally (they use
      # /bin/ls). See docs/testing.md. Never fetch a malware sample into CI.
      - run: bun test
